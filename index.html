<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Physiology Quest</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f7f7fb;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h1,h2,h3{
    color:#333;
}

button{
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
}

.primary{
    background:#58cc02;
    color:white;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    margin:8px 0;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    background:white;
}

.green{
    background:#d4f8d4 !important;
}

.red{
    background:#ffd8d8 !important;
}

.match-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.match-card{
    border:1px solid #ccc;
    border-radius:10px;
    padding:15px;
    cursor:pointer;
    text-align:center;
    background:white;
}

.selected{
    border:3px solid #58cc02;
}

.hidden{
    display:none;
}

.feedback{
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    font-size:16px;
}

.flashcard{
    min-height:150px;
}

.center{
    text-align:center;
}

</style>
</head>

<body>

<div id="app"></div>

<script>

let lessonStep=0;
let attempts=0;

const app=document.getElementById("app");

function introPage(){

app.innerHTML=`

<div class="card">

<h1>Unit 1: ENS Structure</h1>

<h3>Lesson 1: Location and Function of ENS</h3>

<p>
Learn the location of the enteric nervous system,
the two plexuses and their primary functions.
</p>

<button class="primary" onclick="next()">
Start Lesson
</button>

</div>

`;

}

function next(){
lessonStep++;
attempts=0;
render();
}

function render(){

switch(lessonStep){

case 1:
exercise1();
break;

case 2:
exercise2();
break;

case 3:
exercise3();
break;

case 4:
exercise4();
break;

case 5:
flashCard1();
break;

case 6:
flashCard2();
break;

case 7:
flashCard3();
break;

case 8:
flashCard4();
break;

default:
completed();

}

}

function correctScreen(callback,text="Correct!"){

app.innerHTML=`

<div class="card green center">

<h2>✅ ${text}</h2>

</div>

`;

setTimeout(callback,1200);

}

function wrongScreen(callback){

app.innerHTML=`

<div class="card red center">

<h2>❌ Try Again</h2>

</div>

`;

setTimeout(callback,1200);

}

function exercise1(){

app.innerHTML=`

<div class="card">

<h2>Exercise 1</h2>

<p>
The ENS is located in which layer of the wall
of the GI tract?
Select all that apply.
</p>

<label>
<input type="checkbox" value="muc">
Mucosa
</label><br>

<label>
<input type="checkbox" value="sub">
Submucosa
</label><br>

<label>
<input type="checkbox" value="mus">
Muscularis externa
</label><br>

<label>
<input type="checkbox" value="ser">
Serosa
</label><br>

<button class="primary" onclick="checkExercise1()">
Submit
</button>

</div>

`;

}

function checkExercise1(){

const checked=[...document.querySelectorAll("input[type=checkbox]:checked")]
.map(x=>x.value);

const correct=
checked.length===2 &&
checked.includes("sub") &&
checked.includes("mus");

if(correct){

correctScreen(next);

}else{

attempts++;

if(attempts<2){

wrongScreen(exercise1);

}else{

app.innerHTML=`

<div class="card">

<h2>Answer</h2>

<p>
The ENS is located within:
</p>

<ul>
<li>Submucosa</li>
<li>Muscularis externa</li>
</ul>

<button class="primary" onclick="next()">
Continue
</button>

</div>

`;

}

}

}

let selected=null;

function exercise2(){

app.innerHTML=`

<div class="card">

<h2>Exercise 2</h2>

<p>
The ENS can be divided into two:
myenteric plexus and submucosal plexus.
</p>

<p>
Match the plexus to the correct location.
Click one item from the left and then
its matching item on the right.
</p>

<div class="match-grid">

<div class="match-card" onclick="choose('myenteric')">
Myenteric plexus
</div>

<div class="match-card" onclick="matchCheck('muscularis')">
Between circular and longitudinal muscle layers of muscularis externa
</div>

<div class="match-card" onclick="choose('submucosal')">
Submucosal plexus
</div>

<div class="match-card" onclick="matchCheck('submucosa')">
Submucosa
</div>

</div>

</div>

`;

selected=null;

window.matchs=0;

}

function choose(item){
selected=item;
}

function matchCheck(target){

const correct=
(selected==="myenteric" && target==="muscularis")
||
(selected==="submucosal" && target==="submucosa");

if(correct){

window.matchs++;

if(window.matchs===2){

correctScreen(next);

}

}else{

attempts++;

if(attempts<2){

wrongScreen(exercise2);

}else{

app.innerHTML=`

<div class="card">

<h2>Correct Answer</h2>

<ul>
<li>Myenteric plexus → Muscularis externa</li>
<li>Submucosal plexus → Submucosa</li>
</ul>

<button class="primary" onclick="next()">
Continue
</button>

</div>

`;

}

}

}

function exercise3(){

app.innerHTML=`

<div class="card">

<h2>Exercise 3</h2>

<p>
Each plexus regulates a certain activity of the GI tract.
Match the plexus to the primary activity
that they regulate.
</p>

<div class="match-grid">

<div class="match-card" onclick="choose('myenteric')">
Myenteric plexus
</div>

<div class="match-card" onclick="matchFunction('motility')">
Motility
</div>

<div class="match-card" onclick="choose('submucosal')">
Submucosal plexus
</div>

<div class="match-card" onclick="matchFunction('secret')">
Secretion and local blood flow
</div>

</div>

</div>

`;

selected=null;
window.matchs=0;

}

function matchFunction(answer){

const correct=
(selected==="myenteric" && answer==="motility")
||
(selected==="submucosal" && answer==="secret");

if(correct){

window.matchs++;

if(window.matchs===2){

app.innerHTML=`

<div class="card green">

<h2>✅ Correct</h2>

<h3>Useful mnemonic</h3>

<p>
<b>M</b>yenteric → <b>M</b>otility
</p>

<p>
<b>S</b>ubmucosal → <b>S</b>ecretion
(and local blood flow)
</p>

<button class="primary" onclick="next()">
Continue
</button>

</div>

`;

}

}else{

attempts++;

if(attempts<2){

wrongScreen(exercise3);

}else{

app.innerHTML=`

<div class="card">

<ul>
<li>Myenteric plexus → Motility</li>
<li>Submucosal plexus → Secretion and local blood flow</li>
</ul>

<button class="primary" onclick="next()">
Continue
</button>

</div>

`;

}

}

}

function exercise4(){

app.innerHTML=`

<div class="card">

<h2>Exercise 4</h2>

<p>
Hirschsprung disease (congenital aganglionic megacolon).
Aganglionic means absence of ganglion cells
in the colon.
</p>

<p>
What is expected to happen?
</p>

<button class="option"
onclick="hirsch(true)">
Reduced colonic motility causing constipation
</button>

<button class="option"
onclick="hirsch(false)">
Excessive colonic motility causing diarrhea
</button>

</div>

`;

}

function hirsch(correct){

if(correct){

correctScreen(next);

}else{

attempts++;

if(attempts<2){

wrongScreen(exercise4);

}else{

app.innerHTML=`

<div class="card">

<h3>Answer</h3>

<p>
Reduced colonic motility causing constipation.
</p>

<button class="primary" onclick="next()">
Continue
</button>

</div>

`;

}

}

}

function flashTemplate(question,answers,nextStep){

app.innerHTML=`

<div class="card flashcard">

<h2>Quick Recall</h2>

<p>${question}</p>

<input id="ans">

<button class="primary"
onclick="checkRecall(${JSON.stringify(answers).replace(/"/g,'&quot;')},${nextStep})">
Submit
</button>

</div>

`;

}

function checkRecall(answers,nextStep){

let val=
document.getElementById("ans")
.value
.trim()
.toLowerCase();

if(answers.includes(val)){

lessonStep=nextStep;

correctScreen(render);

}else{

app.querySelector(".card").classList.add("red");

setTimeout(()=>{

app.innerHTML=`

<div class="card">

<p><b>Correct answer:</b></p>

<p>${answers[0]}</p>

<button class="primary" onclick="
lessonStep=${nextStep};
render();
">
Continue
</button>

</div>

`;

},1000);

}

}

function flashCard1(){
flashTemplate(
"Name of ENS in the muscularis externa",
["myenteric plexus","myenteric"],
6
);
}

function flashCard2(){
flashTemplate(
"Name of ENS in the submucosa",
["submucosal plexus","submucosal"],
7
);
}

function flashCard3(){
flashTemplate(
"Primary activity regulated by the myenteric plexus",
["motility"],
8
);
}

function flashCard4(){
flashTemplate(
"Primary activity regulated by the submucosal plexus",
[
"secretion and local blood flow",
"local blood flow and secretion",
"secretion"
],
9
);
}

function completed(){

app.innerHTML=`

<div class="card green center">

<h1>🏆 Lesson Complete</h1>

<p>
You have mastered the basic structure and function
of the ENS.
</p>

<p>
Next lesson:
Neuron Types of the ENS
</p>

</div>

`;

}

introPage();

</script>

</body>
</html>
