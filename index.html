<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Physiology Quest V3</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;max-width:900px;margin:auto;padding:20px;}
.card{background:white;border-radius:20px;padding:25px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.progress{width:100%;height:18px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:10px}
.progress-fill{height:100%;background:#58cc02;transition:.4s}
button{padding:12px 18px;border:none;border-radius:12px;cursor:pointer;margin-top:10px}
.primary{background:#58cc02;color:white}.option{display:block;width:100%;padding:12px;margin-top:10px;border-radius:12px;border:1px solid #ccc;background:white;text-align:left}
.green{background:#d4f8d4!important}.red{background:#ffd8d8!important}.center{text-align:center}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.match-card{padding:15px;border:2px solid #ccc;border-radius:12px;cursor:pointer;background:white;text-align:center;transition:.2s}
.match-card.selected{background:#ffe8a3;border:3px solid #ffb300;transform:scale(1.08)}
.match-card.correct{background:#d4f8d4;border:3px solid #58cc02}
.match-card.wrong{background:#ffd8d8;border:3px solid red}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc}
.flash-wrap{perspective:1000px}.flash-inner{position:relative;width:100%;min-height:250px;transition:transform .7s;transform-style:preserve-3d}.flash-inner.flipped{transform:rotateY(180deg)}
.flash-front,.flash-back{position:absolute;width:100%;min-height:250px;backface-visibility:hidden;border-radius:20px;padding:25px;box-sizing:border-box}.flash-front{background:white}.flash-back{transform:rotateY(180deg)}
.flash-back.correct{background:#d4f8d4}.flash-back.wrong{background:#ffd8d8}
</style></head><body><div id="app"></div>
<script>
const TOTAL_STEPS=8; let step=0,attempts=0,selected=null,matches=0; const app=document.getElementById('app');
function progressBar(){let p=(step/TOTAL_STEPS)*100; return `<p>Exercise ${step} of ${TOTAL_STEPS}</p><div class='progress'><div class='progress-fill' style='width:${p}%'></div></div>`;}
function startPage(){app.innerHTML=`<div class='card'><h1>Unit 1: ENS Structure</h1><h3>Lesson 1: Location and Function of ENS</h3><button class='primary' onclick='nextStep()'>Start Lesson</button></div>`}
function nextStep(){step++;attempts=0;render()}
function render(){switch(step){case 1:exercise1();break;case 2:exercise2();break;case 3:exercise3();break;case 4:exercise4();break;case 5:flashCard('Name the ENS in the muscularis externa',['myenteric plexus','myenteric'],6);break;case 6:flashCard('Name the ENS in the submucosa',['submucosal plexus','submucosal'],7);break;case 7:flashCard('Primary activity in the GI tract regulated by the myenteric plexus',['motility'],8);break;case 8:flashCard('Primary activity in the GI tract regulated by the submucosal plexus',['secretion and local blood flow','local blood flow and secretion','secretion'],9);break;default:finish();}}
function correctNext(){app.innerHTML=`${progressBar()}<div class='card green center'><h2>✅ Correct</h2></div>`; setTimeout(nextStep,900)}
function exercise1(){app.innerHTML=`${progressBar()}<div class='card'><h2>Exercise 1</h2><p>The ENS is located in which layer of the wall of the GI tract? Select all that apply.</p><label><input type='checkbox' value='muc'> Mucosa</label><br><br><label><input type='checkbox' value='sub'> Submucosa</label><br><br><label><input type='checkbox' value='mus'> Muscularis externa</label><br><br><label><input type='checkbox' value='ser'> Serosa</label><br><br><button class='primary' onclick='checkEx1()'>Submit</button></div>`}
function checkEx1(){let c=[...document.querySelectorAll('input:checked')].map(x=>x.value); let ok=c.length===2&&c.includes('sub')&&c.includes('mus'); if(ok)correctNext(); else{attempts++; if(attempts==1){document.querySelector('.card').classList.add('red'); setTimeout(exercise1,1000)} else {app.innerHTML=`${progressBar()}<div class='card red'><h2>Answer</h2><ul><li>Submucosa</li><li>Muscularis externa</li></ul><button class='primary' onclick='nextStep()'>Continue</button></div>`}}}
function exercise2(){selected=null;matches=0; app.innerHTML=`${progressBar()}<div class='card'><h2>Exercise 2</h2><p>The ENS can be divided into two: myenteric plexus and submucosal plexus.</p><p>Match the plexus to the correct location.</p><div class='match-grid'><div id='myenteric' class='match-card' onclick="pickLeft(this,'myenteric')">Myenteric plexus</div><div class='match-card' onclick="matchLocation(this,'submucosa')">Submucosa</div><div id='submucosal' class='match-card' onclick="pickLeft(this,'submucosal')">Submucosal plexus</div><div class='match-card' onclick="matchLocation(this,'muscularis')">Muscularis externa</div></div></div>`}
function pickLeft(card,val){document.querySelectorAll('.match-card').forEach(c=>c.classList.remove('selected')); card.classList.add('selected'); selected=val;}
function matchLocation(card,target){if(!selected)return; let ok=(selected==='myenteric'&&target==='muscularis')||(selected==='submucosal'&&target==='submucosa'); let left=document.getElementById(selected); if(ok){left.classList.remove('selected'); left.classList.add('correct'); card.classList.add('correct'); matches++; selected=null; if(matches===2)setTimeout(correctNext,700);} else {left.classList.add('wrong'); card.classList.add('wrong'); attempts++; setTimeout(()=>{if(attempts===1)exercise2(); else nextStep();},900)}}
function exercise3(){selected=null;matches=0; app.innerHTML=`${progressBar()}<div class='card'><h2>Exercise 3</h2><p>Each plexus regulates a certain activity of the GI tract. Match the plexus to the primary activity that they regulate.</p><div class='match-grid'><div id='myenteric' class='match-card' onclick="pickLeft(this,'myenteric')">Myenteric plexus</div><div class='match-card' onclick="matchFunction(this,'secretion')">Secretion and local blood flow</div><div id='submucosal' class='match-card' onclick="pickLeft(this,'submucosal')">Submucosal plexus</div><div class='match-card' onclick="matchFunction(this,'motility')">Motility</div></div></div>`}
function matchFunction(card,val){if(!selected)return; let ok=(selected==='myenteric'&&val==='motility')||(selected==='submucosal'&&val==='secretion'); let left=document.getElementById(selected); if(ok){left.classList.remove('selected'); left.classList.add('correct'); card.classList.add('correct'); matches++; selected=null; if(matches===2){app.innerHTML=`${progressBar()}<div class='card green'><h2>✅ Correct</h2><h3>Useful mnemonic</h3><p><b>M</b>yenteric → <b>M</b>otility</p><p><b>S</b>ubmucosal → <b>S</b>ecretion (and local blood flow)</p><button class='primary' onclick='nextStep()'>Continue</button></div>`}} else {left.classList.add('wrong'); card.classList.add('wrong'); attempts++; setTimeout(()=>{if(attempts===1)exercise3(); else nextStep();},900)}}
function exercise4(){app.innerHTML=`${progressBar()}<div class='card'><h2>Exercise 4</h2><p>Hirschsprung disease also known as congenital aganglionic megacolon.</p><p>Aganglionic means absence of ganglion cells in the large intestine (colon).</p><p>What is expected to happen?</p><button class='option' onclick='hirsch(true)'>Reduced colonic motility causing constipation</button><button class='option' onclick='hirsch(false)'>Increased colonic motility causing diarrhea</button></div>`}
function hirsch(correct){if(correct)correctNext(); else {attempts++; if(attempts===1){document.querySelector('.card').classList.add('red'); setTimeout(exercise4,1000)} else nextStep();}}
function flashCard(question,answers,nextPos){attempts=0; app.innerHTML=`${progressBar()}<div class='flash-wrap'><div class='flash-inner' id='flash'><div class='flash-front card'><h2>Quick Recall</h2><p>${question}</p><input id='flashInput' type='text'><button class='primary' onclick='submitFlash(${JSON.stringify(answers)},${nextPos})'>Submit</button></div><div class='flash-back card' id='backCard'></div></div></div>`}
function submitFlash(answers,nextPos){const flash=document.getElementById('flash'); const back=document.getElementById('backCard'); const ans=document.getElementById('flashInput').value.trim().toLowerCase(); if(answers.includes(ans)){back.className='flash-back card correct'; back.innerHTML=`<h2>✅ Correct</h2><p>${answers[0]}</p><button class='primary' onclick='step=${nextPos};render()'>Next Card</button>`; flash.classList.add('flipped');} else {attempts++; if(attempts===1){back.className='flash-back card wrong'; back.innerHTML='<h2>❌ Wrong</h2><p>Try again.</p>'; flash.classList.add('flipped'); setTimeout(()=>{flash.classList.remove('flipped'); document.getElementById("flashInput").focus();},1500);} else {back.className='flash-back card wrong'; back.innerHTML=`<h2>❌ Wrong</h2><p>Correct answer:</p><h3>${answers[0]}</h3><button class='primary' onclick='step=${nextPos};render()'>Next Card</button>`; flash.classList.add('flipped');}}}
function finish(){app.innerHTML=`<div class='card green center'><h1>🏆 Lesson Complete</h1><p>You have mastered the basic structure and function of the ENS.</p></div>`}
startPage();
</script></body></html>
